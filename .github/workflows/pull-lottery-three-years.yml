name: Pull three-year lottery dataset

on:
  push:
    branches:
      - lottery-data-20260813
    paths:
      - lottery_full_pull.py
      - .github/workflows/pull-lottery-three-years.yml
  workflow_dispatch:

jobs:
  pull-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 lxml
      - name: Pull and validate data
        run: python lottery_full_pull.py
      - name: Upload dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-three-years-dataset
          path: lottery_output/
          if-no-files-found: warn
          retention-days: 14
